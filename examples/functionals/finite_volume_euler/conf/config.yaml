hydra:
  job:
    chdir: True
  run:
    dir: ./outputs_finite_volume_euler

solver:
  device: cpu
  implementation: torch
  gamma: 1.4
  cfl: 0.35
  inflow_mach: 3.0
  inflow_density: 1.4
  inflow_pressure: 1.0
  density_floor: 1.0e-6
  pressure_floor: 1.0e-6
  log_every: 10

cases:
  - name: forward_step_2d
    dimension: 2
    length: 3.0
    height: 1.0
    step_x: 0.6
    step_height: 0.2
    nx: 100
    ny: 40
    steps: 80
    plot_every: 4
    make_animation: true
    density_vmin: 0.6
    density_vmax: 6.5

  - name: forward_step_3d
    dimension: 3
    length: 3.0
    height: 1.0
    depth: 0.25
    step_x: 0.6
    step_height: 0.2
    nx: 50
    ny: 20
    nz: 4
    steps: 40
    plot_every: 4
    make_animation: true
    density_vmin: 0.6
    density_vmax: 6.5
